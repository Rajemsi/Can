<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#d8b77e"><title>Ödeme Bilgileri</title><link rel="stylesheet" href="style.css?v=3"></head>
<body><main class="page"><header class="header"><div class="signature">Can Açıkalın</div><div class="page-title">ÖDEME BİLGİLERİ</div></header>
<section class="payment-card"><div class="bank-icon">🏛️</div>
<div class="info-box"><div class="info-line"><div class="small-icon">👤</div><div class="info-content"><div class="label">Ad Soyad</div><div id="name" class="value">Yükleniyor...</div></div></div>
<button id="copyName" class="copy-button" type="button">▣ &nbsp; İsmi Kopyala</button><div id="nameStatus" class="success-message"></div></div>
<div class="info-box"><div class="info-line"><div class="small-icon">💳</div><div class="info-content"><div class="label">IBAN</div><div id="iban" class="value iban-value">Yükleniyor...</div></div></div>
<button id="copyIban" class="copy-button" type="button">▣ &nbsp; IBAN'ı Kopyala</button><div id="ibanStatus" class="success-message"></div></div>
<div class="secure-message">🔒 Ödeme bilgilerini göndermeden önce alıcı bilgilerini kontrol edin.</div><div class="thanks">Teşekkür ederiz. 🙏</div></section>
<div class="bottom-decoration"><span></span><b>✦</b><span></span></div></main><script src="script.js?v=3"></script></body></html>
