<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dfbd83">
  <title>Ödeme Bilgileri</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <main class="page">
    <header class="hero">
      <img class="signature" src="signature.png?v=5" alt="Can Açıkalın imzası">
      <div class="title-row"><span></span><h1>ÖDEME BİLGİLERİ</h1><span></span></div>
    </header>

    <section class="glass-card">
      <div class="bank-medallion" aria-hidden="true">
        <div class="bank-roof"></div><div class="bank-columns"><i></i><i></i><i></i></div><div class="bank-base"></div>
      </div>

      <article class="info-card">
        <div class="info-head">
          <div class="round-icon person-icon" aria-hidden="true"><i></i></div>
          <div class="info-text"><div class="label">Ad Soyad</div><div id="name" class="value">Yükleniyor...</div></div>
        </div>
        <button id="copyName" class="gold-btn" type="button"><span class="copy-icon" aria-hidden="true"></span>İsmi Kopyala</button>
        <div id="nameStatus" class="status"></div>
      </article>

      <article class="info-card">
        <div class="info-head">
          <div class="round-icon card-icon" aria-hidden="true"><i></i></div>
          <div class="info-text"><div class="label">IBAN</div><div id="iban" class="value iban">Yükleniyor...</div></div>
        </div>
        <button id="copyIban" class="gold-btn" type="button"><span class="copy-icon" aria-hidden="true"></span>IBAN'ı Kopyala</button>
        <div id="ibanStatus" class="status"></div>
      </article>

      <div class="security"><span class="lock" aria-hidden="true"></span>Ödeme bilgilerinizi göndermeden önce alıcı bilgilerini kontrol edin.<br><span>Teşekkür ederiz.</span></div>
    </section>
    <div class="ornament"><span></span><b>◆</b><span></span></div>
  </main>
  <script src="script.js?v=5"></script>
</body>
</html>
